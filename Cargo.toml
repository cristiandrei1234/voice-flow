[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters/asr-sherpa",
    "crates/adapters/audio-cpal",
    "crates/adapters/hotkey",
    "crates/adapters/output-paste",
    "crates/adapters/llm-openai",
    "crates/presentation",
    "crates/app",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

[workspace.dependencies]
vf-domain = { path = "crates/domain" }
vf-application = { path = "crates/application" }
vf-audio-cpal = { path = "crates/adapters/audio-cpal" }
vf-hotkey = { path = "crates/adapters/hotkey" }
vf-output-paste = { path = "crates/adapters/output-paste" }
vf-llm-openai = { path = "crates/adapters/llm-openai" }
vf-presentation = { path = "crates/presentation" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
unicode-normalization = "0.1"
tempfile = "3"
sherpa-onnx = { version = "2.0.1", default-features = false }
cpal = "0.15"
handy-keys = "0.3"
arboard = "3"
enigo = "0.2"
ureq = { version = "2", features = ["json"] }
hound = "3.5"
clap = { version = "4", features = ["derive"] }
dirs = "5"
slint = { version = "1.18", features = ["unstable-winit-030"] }
slint-build = "1.18"

[profile.release]
lto = "thin"
codegen-units = 1
